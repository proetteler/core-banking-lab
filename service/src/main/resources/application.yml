spring:
  application:
    name: core-banking-integration-service
  datasource:
    # Zugangsdaten nur über Umgebungsvariablen, kein Default fürs Passwort (fail fast)
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${DB_USER:CORE_BANK_API}
    password: ${DB_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        # Nur health und info, sonst nichts
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: Core Banking Lab Integration Service
    description: REST facade for the PL/SQL packages booking_api and account_api

springdoc:
  swagger-ui:
    path: /swagger-ui.html
