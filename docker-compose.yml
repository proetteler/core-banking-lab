services:
  oracle:
    image: gvenzl/oracle-free:23.26.1
    container_name: cbl-oracle
    ports:
      - "127.0.0.1:1521:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
      APP_USER: ${APP_USER}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD}
      # Nur für security/01_api_user.sql (docker exec), die DB selbst braucht es nicht
      API_USER_PASSWORD: ${API_USER_PASSWORD:?API_USER_PASSWORD fehlt in .env}
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./db:/opt/cbl/db:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # Kafka Single Node im KRaft-Modus (ohne ZooKeeper). Nur das interne Netz, kein Host-Port.
  # PLAINTEXT ohne Login: reicht fürs Lab, nicht für produktiven Betrieb.
  kafka:
    image: apache/kafka:4.3.2
    container_name: cbl-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Ein Broker: alles mit Replikationsfaktor 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics nur über kafka-init, kein stilles Anlegen durch Tippfehler
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  # Legt die Topics an und beendet sich. 3 Partitionen: gleicher Key = gleiche Partition = Reihenfolge.
  # Das DLT braucht gleich viele Partitionen wie payment-orders.
  kafka-init:
    image: apache/kafka:4.3.2
    container_name: cbl-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for topic in core-banking.booking-events core-banking.payment-orders core-banking.payment-results core-banking.payment-orders.DLT; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic "$$topic" --partitions 3 --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    container_name: cbl-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: core-banking-lab
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "false"

  service:
    build: ./service
    container_name: cbl-service
    depends_on:
      oracle:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Service-User mit Execute-Recht auf die Packages, nicht CORE_BANK (Least Privilege)
      DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      DB_USER: CORE_BANK_API
      DB_PASSWORD: ${API_USER_PASSWORD}
    # Der User CORE_BANK_API muss existieren (security/01_api_user.sql), sonst startet der Service neu
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  oracle-data:
  kafka-data:
